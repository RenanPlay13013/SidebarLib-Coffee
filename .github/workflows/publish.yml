name: Publish

on:
  push:
    branches: [ "main" ]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build + Publish
        run: ./gradlew publish
        env:
          mvnUser: ${{ secrets.MVN_USER }}
          mvnPassword: ${{ secrets.MVN_PASSWORD }}
          GITHUB_REPOSITORY: ${{ github.repository }}